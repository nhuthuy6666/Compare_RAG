<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTU Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #111318;
      --surface-2: #181c23;
      --surface-3: #1e232d;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.13);
      --text: #e8edf5;
      --text-2: #8a95a3;
      --text-3: #576070;
      --accent: #4e9bff;
      --accent-dim: rgba(78,155,255,0.12);
      --accent-glow: rgba(78,155,255,0.2);
      --user-bg: #0f1e35;
      --user-border: rgba(78,155,255,0.2);
      --asst-bg: #111318;
      --danger: #e05252;
      --ok: #3ecf7a;
      --r: 12px;
      --r-lg: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    .hidden { display: none !important; }

    .shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(78,155,255,0.25);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .brand-chip::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .sidebar-head h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .sidebar-head p {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.5;
    }

    .sidebar-nav {
      padding: 12px 12px 8px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--r);
      font-size: 13px;
      color: var(--text-2);
      transition: background 0.15s, color 0.15s;
    }

    .sidebar-nav a:hover { background: var(--surface-2); color: var(--text); }
    .sidebar-nav a.active { background: var(--accent-dim); color: var(--accent); }

    .sidebar-actions {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 10px 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-size: 13px;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 10px 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-size: 13px;
    }

    .btn-danger:hover { opacity: 0.88; }
    .btn-danger:active { transform: scale(0.98); }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-hover); }

    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--text-2);
      border-radius: var(--r);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: color 0.15s;
    }

    .btn-ghost:hover { color: var(--text); }

    .sidebar-search {
      padding: 10px 12px 6px;
    }

    .search-box {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      transition: border-color 0.15s;
      outline: none;
    }

    .search-box::placeholder { color: var(--text-3); }
    .search-box:focus { border-color: var(--border-hover); }

    .history-label {
      padding: 10px 14px 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
    }

    .history-item {
      display: flex;
      align-items: stretch;
      gap: 2px;
      border-radius: var(--r);
      overflow: hidden;
    }

    .history-item.active .history-main { background: var(--accent-dim); }
    .history-item.active .history-main strong { color: var(--accent); }

    .history-main {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      border-radius: var(--r);
      transition: background 0.12s;
      min-width: 0;
    }

    .history-main:hover { background: var(--surface-2); }

    .history-main strong {
      display: block;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .history-meta {
      display: block;
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-3);
      padding: 6px 8px;
      cursor: pointer;
      border-radius: var(--r);
      font-size: 15px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
      align-self: center;
    }

    .delete-btn:hover { color: var(--danger); background: rgba(224,82,82,0.08); }

    /* ── Main ── */
    .main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
    }

    .header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      background: rgba(10,12,15,0.9);
      backdrop-filter: blur(16px);
      z-index: 10;
    }

    .header-dot {
      width: 8px;
      height: 8px;
      background: var(--ok);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--ok);
      flex-shrink: 0;
    }

    .header-copy h2 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .header-copy p {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 1px;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .session-badge {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-2);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
    }

    .empty-state {
      max-width: 560px;
      margin: auto;
      padding: 20px 32px;
      text-align: center;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      background: var(--accent-dim);
      border: 1px solid rgba(78,155,255,0.2);
      border-radius: 14px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg { color: var(--accent); }

    .empty-state h3 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text-2);
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .chip:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-hover); }

    .login-card {
      width: min(460px, calc(100% - 32px));
      margin: auto;
      padding: 34px;
      background:
        radial-gradient(circle at top right, rgba(78,155,255,0.12), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.015), transparent 100%),
        var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }

    .auth-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      margin-bottom: 16px;
      border-radius: 999px;
      border: 1px solid rgba(78,155,255,0.18);
      background: rgba(78,155,255,0.08);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-kicker::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
    }

    .login-card h3 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      padding: 4px;
      background: rgba(78,155,255,0.06);
      border: 1px solid rgba(78,155,255,0.12);
      border-radius: 14px;
    }

    .auth-tab {
      flex: 1;
      background: rgba(78,155,255,0.08);
      color: var(--accent);
      border: 1px solid rgba(78,155,255,0.14);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .auth-tab:hover { background: rgba(78,155,255,0.16); color: #dcecff; border-color: rgba(78,155,255,0.24); }
    .auth-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: rgba(78,155,255,0.42);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .login-form input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .login-form input:hover { background: rgba(255,255,255,0.04); }
    .login-form input:focus {
      border-color: rgba(78,155,255,0.45);
      box-shadow: 0 0 0 3px rgba(78,155,255,0.14);
      background: rgba(255,255,255,0.05);
    }
    .login-form input::placeholder { color: var(--text-3); }

    .auth-submit {
      width: 100%;
      margin-top: 4px;
      padding: 11px 14px;
      border-radius: 14px;
    }

    .notice {
      font-size: 12px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .notice.error {
      color: #f08080;
      background: rgba(224,82,82,0.08);
      border-color: rgba(224,82,82,0.2);
    }

    .notice.success {
      color: #b3f0ca;
      background: rgba(62,207,122,0.1);
      border-color: rgba(62,207,122,0.24);
    }

    .notice a {
      color: inherit;
      text-decoration: underline;
    }

    .modal-root {
      position: fixed;
      inset: 0;
      background: rgba(6,10,16,0.56);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }

    .modal-card {
      width: min(460px, 100%);
      background:
        radial-gradient(circle at top right, rgba(78,155,255,0.12), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.018), transparent 100%),
        var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      padding: 24px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-head h3 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .modal-head p {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
    }

    .icon-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text-2);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
    }

    .icon-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }

    .account-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .account-section {
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .account-section:first-child {
      padding-top: 0;
      border-top: none;
    }

    .account-section h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .account-section p {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .error { color: #f08080; font-size: 12px; padding: 8px 12px; background: rgba(224,82,82,0.08); border-radius: var(--r); border: 1px solid rgba(224,82,82,0.2); }
    .ok-msg { color: var(--ok); font-size: 12px; }

    /* ── Row & Bubbles ── */
    .row {
      display: flex;
      padding: 4px 28px;
    }

    .row.user { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }

    .bubble-wrap {
      max-width: min(680px, 90%);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-meta {
      font-size: 11px;
      color: var(--text-3);
      padding: 0 4px;
    }

    .row.user .msg-meta { text-align: right; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .row.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    .row.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .loading-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .loading-bubble span {
      width: 5px;
      height: 5px;
      background: var(--text-3);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .loading-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .loading-bubble span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ── Sources ── */
    .sources {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .source-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 0 2px;
    }

    .source-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 12px;
    }

    .source-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .source-score {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .source-path, .source-content {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.5;
      margin-top: 2px;
    }

    /* ── Composer ── */
    .composer {
      padding: 16px 24px 20px;
      background: rgba(10,12,15,0.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
    }

    .composer-box {
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: border-color 0.15s;
    }

    .composer-box:focus-within {
      border-color: rgba(78,155,255,0.35);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    textarea {
      flex: 1;
      min-height: 24px;
      height: 24px;
      max-height: 160px;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      line-height: 24px;
      font-size: 14px;
      margin: 0;
      padding: 0;
      display: block;
      overflow-y: auto;
    }

    textarea::placeholder { color: var(--text-3); }

    .sources { display: none !important; }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: center;
      transition: opacity 0.15s, transform 0.1s;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .send-btn svg { width: 16px; height: 16px; }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 2px;
    }

    .status-text {
      font-size: 11px;
      color: var(--text-3);
      font-family: 'IBM Plex Mono', monospace;
    }

    .hint-text {
      font-size: 11px;
      color: var(--text-3);
    }

    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
      .row { padding: 4px 16px; }
      .header { padding: 14px 18px; }
      .login-card { width: min(100%, calc(100% - 24px)); padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div id="brandBadge" class="brand-chip"></div>
        <h1 id="brandTitle"></h1>
        <p id="brandDescription"></p>
      </div>
      <nav id="tabs" class="sidebar-nav"></nav>
      <div class="sidebar-actions">
        <button id="newChatBtn" class="btn-primary" type="button"></button>
        <a id="adminLink" class="btn-secondary" href="/admin">Trang quản trị</a>
      </div>
      <div class="sidebar-search">
        <input id="historySearch" class="search-box" type="text" placeholder="Tìm trong lịch sử...">
      </div>
      <div id="historyLabel" class="history-label"></div>
      <div id="historyList" class="history-list"></div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-dot"></div>
        <div class="header-copy">
          <h2 id="headerTitle"></h2>
          <p id="headerSubtitle"></p>
        </div>
        <div class="header-right">
          <span id="sessionLabel" class="session-badge"></span>
          <button id="accountBtn" class="btn-secondary hidden" type="button">Tài khoản</button>
          <button id="logoutBtn" class="btn-ghost hidden" type="button">Đăng xuất</button>
        </div>
      </header>

      <section id="messages" class="messages"></section>

      <footer class="composer">
        <div class="composer-box">
          <textarea id="input" placeholder=""></textarea>
          <button id="sendBtn" class="send-btn" type="button" aria-label="Gửi">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 8h12M9 3l5 5-5 5"/>
            </svg>
          </button>
        </div>
        <div class="composer-footer">
          <span id="statusLine" class="status-text"></span>
          <span id="composerHint" class="hint-text"></span>
        </div>
      </footer>
    </main>
  </div>
  <div id="accountRoot" class="modal-root hidden"></div>

  <script>
    const APP_CONFIG = __CHAT_UI_CONFIG__;
    const tabsEl = document.getElementById("tabs");
    const historyListEl = document.getElementById("historyList");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const statusLine = document.getElementById("statusLine");
    const historySearchEl = document.getElementById("historySearch");
    const logoutBtn = document.getElementById("logoutBtn");
    const accountBtn = document.getElementById("accountBtn");
    const accountRoot = document.getElementById("accountRoot");
    const adminLink = document.getElementById("adminLink");
    let currentSession = null;
    let sessions = [];
    let activeSessionId = "";
    let sessionInfo = null;
    let isSending = false;
    let authMode = "login";
    let authMessage = "";
    let authMessageType = "error";
    let pendingIdentifier = "";
    let verificationLink = "";
    let selfServiceEnabled = false;

    init();

    function init() {
      applyCopy();
      bindEvents();
      renderTabs();
      checkSession();
    }

    function applyCopy() {
      document.title = APP_CONFIG.page_title;
      document.getElementById("brandBadge").textContent = APP_CONFIG.brand_badge;
      document.getElementById("brandTitle").textContent = APP_CONFIG.brand_title;
      document.getElementById("brandDescription").textContent = APP_CONFIG.brand_description;
      document.getElementById("headerTitle").textContent = APP_CONFIG.header_badge;
      document.getElementById("headerSubtitle").textContent = APP_CONFIG.header_subtitle;
      document.getElementById("historyLabel").textContent = APP_CONFIG.history_label;
      inputEl.placeholder = APP_CONFIG.placeholder;
      document.getElementById("composerHint").textContent = APP_CONFIG.composer_hint;
      newChatBtn.textContent = APP_CONFIG.new_chat_label;
      adminLink.href = APP_CONFIG.admin_href;
    }

    function bindEvents() {
      newChatBtn.addEventListener("click", () => {
        if (!sessionInfo) { renderLogin("Vui lòng đăng nhập để tạo hội thoại."); return; }
        sessions.unshift(createSession());
        activeSessionId = sessions[0].id;
        persistState();
        renderApp();
      });
      sendBtn.addEventListener("click", handleSend);
      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          handleSend();
        }
      });
      inputEl.addEventListener("input", autoResize);
      historySearchEl.addEventListener("input", renderHistory);
      accountBtn.addEventListener("click", openAccountPanel);
      logoutBtn.addEventListener("click", logout);
    }

    async function checkSession() {
      try {
        const response = await fetch(APP_CONFIG.api_session_url, { credentials: "same-origin" });
        const payload = await response.json();
        if (!response.ok || !payload.authenticated) {
          sessionInfo = null;
          selfServiceEnabled = false;
          renderLogin();
          return;
        }
        sessionInfo = payload.session;
        selfServiceEnabled = Boolean(payload.self_service_enabled);
        authMessage = "";
        verificationLink = "";
        loadState();
        renderApp();
      } catch (error) {
        renderLogin("Không kiểm tra được phiên đăng nhập.");
      }
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      APP_CONFIG.tabs.forEach((tab) => {
        const link = document.createElement("a");
        const url = new URL(tab.href, window.location.href);
        url.protocol = window.location.protocol;
        url.hostname = window.location.hostname;
        link.href = url.toString();
        link.textContent = tab.label;
        if (tab.id === APP_CONFIG.current_rag_id) { link.className = "active"; }
        tabsEl.appendChild(link);
      });
    }

    function renderLogin(message = authMessage, mode = authMode, messageType = authMessageType, link = verificationLink) {
      authMode = mode;
      authMessage = message || "";
      authMessageType = messageType || "error";
      verificationLink = link || "";
      const notice = authMessage
        ? `<div class="notice ${escapeHtml(authMessageType)}">${escapeHtml(authMessage)}${verificationLink ? ` <a href="${escapeHtml(verificationLink)}" target="_blank" rel="noreferrer">Mở liên kết xác thực</a>` : ""}</div>`
        : "";
      messagesEl.innerHTML = `
        <div class="login-card">
          <div class="auth-kicker">NTU Client Access</div>
          <div class="auth-tabs">
            <button id="loginTabBtn" class="auth-tab ${authMode === "login" ? "active" : ""}" type="button">Đăng nhập</button>
            <button id="registerTabBtn" class="auth-tab ${authMode === "register" ? "active" : ""}" type="button">Đăng ký</button>
          </div>
          <h3>${authMode === "register" ? "Tạo tài khoản mới" : "Đăng nhập vào NTU Bot"}</h3>
          ${notice}
          <form id="loginForm" class="login-form ${authMode === "login" ? "" : "hidden"}">
            <input id="loginUsername" type="text" placeholder="Email hoặc tên đăng nhập" autocomplete="username">
            <input id="loginPassword" type="password" placeholder="Mật khẩu" autocomplete="current-password">
            <button class="btn-primary auth-submit" type="submit">Đăng nhập</button>
          </form>
          <form id="registerForm" class="login-form ${authMode === "register" ? "" : "hidden"}">
            <input id="registerDisplayName" type="text" placeholder="Tên hiển thị" autocomplete="name">
            <input id="registerEmail" type="email" placeholder="Email" autocomplete="email">
            <input id="registerPassword" type="password" placeholder="Mật khẩu (ít nhất 8 ký tự)" autocomplete="new-password">
            <input id="registerPasswordConfirm" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
            <button class="btn-primary auth-submit" type="submit">Đăng ký và gửi email xác thực</button>
          </form>
        </div>`;
      document.getElementById("loginTabBtn").addEventListener("click", () => renderLogin("", "login", "error", ""));
      document.getElementById("registerTabBtn").addEventListener("click", () => renderLogin("", "register", "error", ""));
      document.getElementById("loginForm").addEventListener("submit", handleLogin);
      document.getElementById("registerForm").addEventListener("submit", handleRegister);
      document.getElementById("loginUsername").value = pendingIdentifier;
      document.getElementById("registerEmail").value = pendingIdentifier;
      historyListEl.innerHTML = "";
      document.getElementById("sessionLabel").textContent = "Chưa đăng nhập";
      accountBtn.classList.add("hidden");
      logoutBtn.classList.add("hidden");
      closeAccountPanel();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;
      pendingIdentifier = username;
      try {
        const response = await fetch(APP_CONFIG.api_login_url, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const payload = await response.json();
        if (!response.ok) { throw new Error(payload.error || "Đăng nhập thất bại."); }
        sessionInfo = payload.session;
        selfServiceEnabled = sessionInfo.account_type === "registered" && Boolean(sessionInfo.email);
        authMessage = "";
        verificationLink = "";
        loadState();
        renderApp();
      } catch (error) {
        renderLogin(error.message || "Đăng nhập thất bại.", "login", "error", "");
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      const displayName = document.getElementById("registerDisplayName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;
      const passwordConfirm = document.getElementById("registerPasswordConfirm").value;
      pendingIdentifier = email;
      if (!email) {
        renderLogin("Vui lòng nhập email.", "register", "error", "");
        return;
      }
      if (password !== passwordConfirm) {
        renderLogin("Mật khẩu xác nhận không khớp.", "register", "error", "");
        return;
      }
      try {
        const response = await fetch(APP_CONFIG.api_register_url, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, display_name: displayName })
        });
        const payload = await response.json();
        if (!response.ok) { throw new Error(payload.error || "Đăng ký thất bại."); }
        renderLogin(payload.message || "Đăng ký thành công.", "login", "success", payload.verification_link || "");
      } catch (error) {
        renderLogin(error.message || "Đăng ký thất bại.", "register", "error", "");
      }
    }

    async function logout() {
      await fetch(APP_CONFIG.api_logout_url, { method: "POST", credentials: "same-origin" }).catch(() => {});
      sessionInfo = null;
      selfServiceEnabled = false;
      sessions = [];
      activeSessionId = "";
      closeAccountPanel();
      renderLogin("Đã đăng xuất.", "login", "success", "");
    }

    function storageKey() {
      const username = sessionInfo?.username || "guest";
      return `${APP_CONFIG.storage_key}:${username}`;
    }

    function activeKey() { return `${storageKey()}:active`; }

    function createSession() {
      return { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title: APP_CONFIG.initial_title, messages: [] };
    }

    function loadState() {
      try {
        sessions = JSON.parse(localStorage.getItem(storageKey()) || "[]");
        if (!Array.isArray(sessions) || !sessions.length) { sessions = [createSession()]; }
      } catch { sessions = [createSession()]; }
      activeSessionId = localStorage.getItem(activeKey()) || sessions[0].id;
      if (!sessions.some((item) => item.id === activeSessionId)) { activeSessionId = sessions[0].id; }
    }

    function persistState() {
      localStorage.setItem(storageKey(), JSON.stringify(sessions));
      localStorage.setItem(activeKey(), activeSessionId);
    }

    function getActiveSession() {
      return sessions.find((item) => item.id === activeSessionId) || sessions[0];
    }

    function renderApp() {
      accountBtn.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      document.getElementById("sessionLabel").textContent = `${sessionInfo.display_name} · ${sessionInfo.role}`;
      renderHistory();
      renderMessages();
      autoResize();
    }

    function openAccountPanel() {
      if (!sessionInfo) { return; }
      const supportsSelfService = selfServiceEnabled && sessionInfo.account_type === "registered";
      const accountDetails = [
        sessionInfo.username ? `TÃªn Ä‘Äƒng nháº­p: ${escapeHtml(sessionInfo.username)}` : "",
        sessionInfo.email && sessionInfo.email !== sessionInfo.username ? `Email: ${escapeHtml(sessionInfo.email)}` : ""
      ].filter(Boolean).join("<br>");
      accountRoot.classList.remove("hidden");
      accountRoot.innerHTML = `
        <div class="modal-card">
          <div class="modal-head">
            <div>
              <h3>Tài khoản</h3>
              <p>${escapeHtml(sessionInfo.display_name || "")} · ${escapeHtml(sessionInfo.role || "")}</p>
            </div>
            <button id="closeAccountBtn" class="icon-btn" type="button" aria-label="Đóng">×</button>
          </div>
          <div id="accountStatus" class="notice hidden"></div>
          <div class="account-stack">
            <div class="account-section">
              <h4>Thông tin đăng nhập</h4>
              <p>${accountDetails || escapeHtml(sessionInfo.email || sessionInfo.username || "")}</p>
            </div>
            ${supportsSelfService ? `
              <div class="account-section">
                <h4>Đổi mật khẩu</h4>
                <p>Cập nhật mật khẩu cho tài khoản hiện tại.</p>
                <form id="changePasswordForm" class="login-form">
                  <input id="currentPassword" type="password" placeholder="Mật khẩu hiện tại" autocomplete="current-password">
                  <input id="newPassword" type="password" placeholder="Mật khẩu mới" autocomplete="new-password">
                  <input id="confirmNewPassword" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
                  <button class="btn-primary auth-submit" type="submit">Đổi mật khẩu</button>
                </form>
              </div>
              <div class="account-section">
                <h4>Xóa tài khoản</h4>
                <p>Xóa vĩnh viễn tài khoản email hiện tại khỏi hệ thống.</p>
                <form id="deleteAccountForm" class="login-form">
                  <input id="deletePassword" type="password" placeholder="Nhập mật khẩu để xác nhận" autocomplete="current-password">
                  <button class="btn-danger auth-submit" type="submit">Xóa tài khoản</button>
                </form>
              </div>` : `
              <div class="account-section">
                <h4>Quản lý tài khoản</h4>
                <p>Tài khoản hệ thống chỉ hỗ trợ đăng nhập. Tùy chọn đổi mật khẩu và xóa tài khoản áp dụng cho tài khoản đăng ký qua email.</p>
              </div>
            `}
          </div>
        </div>`;
      accountRoot.onclick = handleAccountBackdropClick;
      document.getElementById("closeAccountBtn").addEventListener("click", closeAccountPanel);
      if (supportsSelfService) {
        document.getElementById("changePasswordForm").addEventListener("submit", handleChangePassword);
        document.getElementById("deleteAccountForm").addEventListener("submit", handleDeleteAccount);
      }
    }

    function closeAccountPanel() {
      accountRoot.classList.add("hidden");
      accountRoot.innerHTML = "";
      accountRoot.onclick = null;
    }

    function handleAccountBackdropClick(event) {
      if (event.target === accountRoot) { closeAccountPanel(); }
    }

    function setAccountStatus(message = "", type = "error") {
      const statusEl = document.getElementById("accountStatus");
      if (!statusEl) { return; }
      if (!message) {
        statusEl.className = "notice hidden";
        statusEl.textContent = "";
        return;
      }
      statusEl.className = `notice ${type}`;
      statusEl.textContent = message;
    }

    async function handleChangePassword(event) {
      event.preventDefault();
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmNewPassword = document.getElementById("confirmNewPassword").value;
      if (newPassword !== confirmNewPassword) {
        setAccountStatus("Mật khẩu mới xác nhận không khớp.", "error");
        return;
      }
      const response = await fetch(APP_CONFIG.api_change_password_url, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
      });
      const payload = await response.json();
      if (!response.ok) {
        setAccountStatus(payload.error || "Không đổi được mật khẩu.", "error");
        return;
      }
      setAccountStatus(payload.message || "Đổi mật khẩu thành công.", "success");
      event.target.reset();
    }

    async function handleDeleteAccount(event) {
      event.preventDefault();
      const password = document.getElementById("deletePassword").value;
      const response = await fetch(APP_CONFIG.api_delete_account_url, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const payload = await response.json();
      if (!response.ok) {
        setAccountStatus(payload.error || "Không xóa được tài khoản.", "error");
        return;
      }
      closeAccountPanel();
      await logout();
    }

    function renderHistory() {
      const keyword = historySearchEl.value.trim().toLowerCase();
      historyListEl.innerHTML = "";
      sessions
        .filter((session) => {
          if (!keyword) { return true; }
          const haystack = [session.title, ...session.messages.map((m) => m.content)].join(" ").toLowerCase();
          return haystack.includes(keyword);
        })
        .forEach((session) => {
          const wrapper = document.createElement("div");
          wrapper.className = "history-item" + (session.id === activeSessionId ? " active" : "");
          const mainBtn = document.createElement("button");
          mainBtn.type = "button";
          mainBtn.className = "history-main";
          const last = session.messages[session.messages.length - 1];
          mainBtn.innerHTML = `<strong>${escapeHtml(session.title)}</strong><span class="history-meta">${escapeHtml(last ? last.content : APP_CONFIG.empty_history_text)}</span>`;
          mainBtn.addEventListener("click", () => {
            activeSessionId = session.id;
            persistState();
            renderApp();
          });
          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "delete-btn";
          deleteBtn.textContent = "×";
          deleteBtn.addEventListener("click", () => {
            sessions = sessions.filter((item) => item.id !== session.id);
            if (!sessions.length) { sessions = [createSession()]; }
            if (!sessions.some((item) => item.id === activeSessionId)) { activeSessionId = sessions[0].id; }
            persistState();
            renderApp();
          });
          wrapper.appendChild(mainBtn);
          wrapper.appendChild(deleteBtn);
          historyListEl.appendChild(wrapper);
        });
    }

    function renderMessages() {
      currentSession = getActiveSession();
      messagesEl.innerHTML = "";
      if (!currentSession || !currentSession.messages.length) {
        messagesEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <h3>${escapeHtml(APP_CONFIG.empty_title)}</h3>
            <p>${escapeHtml(APP_CONFIG.empty_description)}</p>
            <div class="chips">${APP_CONFIG.suggestions.map((item) => `<button type="button" class="chip">${escapeHtml(item)}</button>`).join("")}</div>
          </div>`;
        messagesEl.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            inputEl.value = chip.textContent;
            autoResize();
            inputEl.focus();
          });
        });
        return;
      }

      currentSession.messages.forEach((message) => {
        const row = document.createElement("div");
        row.className = "row " + message.role;
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = message.role === "user" ? "Bạn" : APP_CONFIG.assistant_label;
        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (message.loading) {
          bubble.classList.add("loading-bubble");
          bubble.innerHTML = `<span></span><span></span><span></span>`;
        } else {
          bubble.textContent = message.content;
        }

        wrap.appendChild(meta);
        wrap.appendChild(bubble);

        if (false && message.role === "assistant" && Array.isArray(message.sources) && message.sources.length) {
          const sourcesWrap = document.createElement("div");
          sourcesWrap.className = "sources";
          const srcHeader = document.createElement("div");
          srcHeader.className = "source-header";
          srcHeader.textContent = `${message.sources.length} nguồn tham khảo`;
          sourcesWrap.appendChild(srcHeader);
          message.sources.forEach((source, index) => {
            const score = source.score === null || source.score === undefined ? "" : Number(source.score).toFixed(4);
            const path = source.relative_path || source.heading_path || "";
            const card = document.createElement("div");
            card.className = "source-card";
            card.innerHTML = `
              <div class="source-title">
                <strong>${escapeHtml(source.source || path || `Nguồn ${index + 1}`)}</strong>
                ${score ? `<span class="source-score">${escapeHtml(score)}</span>` : ""}
              </div>
              ${path ? `<div class="source-path">${escapeHtml(path)}</div>` : ""}
              ${source.content ? `<div class="source-content">${escapeHtml(source.content)}</div>` : ""}`;
            sourcesWrap.appendChild(card);
          });
          wrap.appendChild(sourcesWrap);
        }

        row.appendChild(wrap);
        messagesEl.appendChild(row);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function handleSend() {
      if (isSending || !sessionInfo) { return; }
      const query = inputEl.value.trim();
      if (!query) { return; }
      const session = getActiveSession();
      session.messages.push({ role: "user", content: query });
      session.messages.push({ role: "assistant", content: "", loading: true });
      session.title = session.title === APP_CONFIG.initial_title ? truncate(query, 52) : session.title;
      persistState();
      renderApp();
      isSending = true;
      sendBtn.disabled = true;
      statusLine.textContent = APP_CONFIG.loading_message;
      inputEl.value = "";
      autoResize();
      try {
        const response = await fetch(APP_CONFIG.api_chat_url, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });
        const payload = await response.json();
        if (response.status === 401) { throw new Error("Phiên đăng nhập đã hết hạn."); }
        if (!response.ok) { throw new Error(payload.error || APP_CONFIG.sending_error_prefix); }
        const last = session.messages[session.messages.length - 1];
        last.loading = false;
        last.content = payload.answer || "";
        statusLine.textContent = APP_CONFIG.ready_message;
      } catch (error) {
        const last = session.messages[session.messages.length - 1];
        last.loading = false;
        last.content = error.message || APP_CONFIG.sending_error_prefix;
        statusLine.textContent = last.content;
        if (String(last.content).includes("hết hạn")) {
          sessionInfo = null;
          renderLogin(last.content);
          return;
        }
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        persistState();
        if (sessionInfo) { renderApp(); }
      }
    }

    function autoResize() {
      const minHeight = 24;
      inputEl.style.height = minHeight + "px";
      inputEl.style.height = Math.min(Math.max(inputEl.scrollHeight, minHeight), 160) + "px";
    }

    function truncate(value, limit) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text.length > limit ? text.slice(0, limit) + "..." : text;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
  </script>
</body>
